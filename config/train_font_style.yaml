dataset:
  # wordlist.txt and font/ must both exist below this directory.
  font_root_path: ./data/fonts_dataset
  samples_per_font: 40

  # DINO view order is fixed: 2 global views, then 4 local views. num_views is
  # kept as an explicit consistency check for the training entry point.
  num_views: 6
  num_global_views: 2
  num_local_views: 4

  layout_probability: 0.70
  characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  min_font_size: 18
  max_font_size: 90
  patch_size: 16

  # These top-level values are also the source-rendering/global defaults.
  min_short_side: 192
  max_long_side: 512
  max_pixels: 262144
  aspect_ratio_range: [0.5, 2.0]

  global_view:
    min_short_side: 192
    max_long_side: 512
    max_pixels: 262144
    aspect_ratio_range: [0.5, 2.0]
    crop_scale: [0.65, 1.0]
    crop_aspect_ratio: [0.5, 2.0]

  local_view:
    min_short_side: 80
    max_long_side: 192
    max_pixels: 36864
    aspect_ratio_range: [0.5, 2.0]
    crop_scale: [0.15, 0.45]
    crop_aspect_ratio: [0.5, 2.0]

  mean: 0.5
  std: 0.5
  recursive_fonts: true
  strict_fonts: false
  max_render_attempts: 8

loader:
  batch_size: 32
  shuffle: true
  num_workers: 4
  pin_memory: false
  drop_last: false
  persistent_workers: false

collator:
  patch_size: 16
  # iBOT++ still masks the student input; its patch loss also covers visible tokens.
  # TIPSv2 reports 75% as its strongest masking-ratio setting.
  ibot_mask_ratio: [0.25, 0.75]
  keep_images: false
  num_global_views: 2

model:
  patch_size: 16
  input_channels: 1
  embed_dim: 384
  depth: 8
  num_heads: 6
  mlp_ratio: 4.0
  qkv_bias: true
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1
  base_grid_size: [32, 32]
  style_dim: 128
  head_hidden_dim: 1024
  head_bottleneck_dim: 256
  head_num_layers: 3
  dino_out_dim: 4096
  ibot_out_dim: 2048

losses:
  weights:
    moco: 1.0
    dino: 1.0
    ibot++: 1.0
  num_global_views: 2
  teacher_momentum: 0.996
  moco:
    queue_size: 3500
    temperature: 0.1
    exclude_same_style_negatives: true
  dino:
    student_temperature: 0.1
    teacher_temperature: 0.07
    warmup_teacher_temperature: 0.04
    warmup_temperature_epochs: 5
    center_momentum: 0.9
  ibot++:
    student_temperature: 0.1
    teacher_temperature: 0.07
    warmup_teacher_temperature: 0.04
    warmup_temperature_epochs: 5
    center_momentum: 0.9
    # 1.0 gives masked and visible valid patches equal per-token weight.
    visible_loss_weight: 1.0

optimizer:
  name: AdamW
  lr: 0.001
  min_lr: 0.000001
  weight_decay: 0.04
  betas: [0.9, 0.999]
  eps: 0.00000001
  scale_lr_by_batch: true
  reference_batch_size: 256

train:
  output_dir: ./outputs/font_style_vit_6
  epochs: 100
  warmup_epochs: 5
  device: cuda
  seed: 42
  amp: true
  amp_dtype: float16
  allow_tf32: true
  gradient_clip_norm: 3.0
  freeze_last_layer_epochs: 1
  log_every: 20
  checkpoint_every_epochs: 5
  resume: null
